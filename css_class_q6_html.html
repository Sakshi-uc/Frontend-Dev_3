<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Demonstration</title>
  <link rel="stylesheet" href="css-animations.css">
</head>
<body>
  <header>
    <h1>CSS Animation Showcase</h1>
    <p>Watch the animations in action!</p>
  </header>

  <main>
    <section class="animation-section">
      <div class="animation-box moving-box">
        <h3>Moving Box</h3>
        <p>translateX animation</p>
      </div>

      <div class="animation-box bouncing-ball">
        <h3>🏀</h3>
        <p>Bouncing animation</p>
      </div>

      <div class="animation-box color-changing">
        <h3>Color Change</h3>
        <p>Background animation</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 CSS Animations Demo</p>
  </footer>
</body>
</html>
