<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="styled-buttons.css">
</head>
<body>
  <header>
    <h1>Styled Button Collection</h1>
    <p>Hover and interact with different button styles</p>
  </header>

  <main>
    <section class="button-section">
      <h2>Primary Buttons</h2>
      <div class="button-row">
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-primary">Save Changes</button>
        <button class="btn btn-primary">Submit</button>
      </div>
    </section>

    <section class="button-section">
      <h2>Secondary Buttons</h2>
      <div class="button-row">
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-secondary">Cancel</button>
        <button class="btn btn-secondary">Go Back</button>
      </div>
    </section>

    <section class="button-section">
      <h2>Outline Buttons</h2>
      <div class="button-row">
        <button class="btn btn-outline">Outline</button>
        <button class="btn btn-outline">Learn More</button>
        <button class="btn btn-outline">View Details</button>
      </div>
    </section>

    <section class="button-section">
      <h2>Disabled Buttons</h2>
      <div class="button-row">
        <button class="btn btn-primary" disabled>Disabled</button>
        <button class="btn btn-secondary" disabled>Not Available</button>
        <button class="btn btn-outline" disabled>Coming Soon</button>
      </div>
    </section>

    <section class="button-section">
      <h2>Button States Demo</h2>
      <div class="button-row">
        <button class="btn btn-hover-demo">Hover Effect</button>
        <button class="btn btn-active-demo">Active Effect</button>
        <button class="btn btn-focus-demo">Focus Effect</button>
      </div>
    </section>

    <section class="button-section">
      <h2>Button Sizes</h2>
      <div class="button-row align-center">
        <button class="btn btn-primary btn-small">Small</button>
        <button class="btn btn-primary btn-medium">Medium</button>
        <button class="btn btn-primary btn-large">Large</button>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 Styled Button Collection</p>
  </footer>
</body>
</html>
