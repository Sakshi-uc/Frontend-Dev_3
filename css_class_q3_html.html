<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="image-showcase.css">
</head>
<body>
  <header>
    <h1>Image Gallery Showcase</h1>
    <p>Hover over images to see effects</p>
  </header>

  <main>
    <section class="gallery">
      <figure class="gallery-item">
        <div class="image-wrapper">
          <div class="image" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <span class="placeholder">Image 1</span>
          </div>
        </div>
        <figcaption>Beautiful Landscape</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="image-wrapper">
          <div class="image" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
            <span class="placeholder">Image 2</span>
          </div>
        </div>
        <figcaption>Modern Architecture</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="image-wrapper">
          <div class="image" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
            <span class="placeholder">Image 3</span>
          </div>
        </div>
        <figcaption>Ocean Waves</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="image-wrapper">
          <div class="image" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
            <span class="placeholder">Image 4</span>
          </div>
        </div>
        <figcaption>Forest Trail</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="image-wrapper">
          <div class="image" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
            <span class="placeholder">Image 5</span>
          </div>
        </div>
        <figcaption>Sunset View</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="image-wrapper">
          <div class="image" style="background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);">
            <span class="placeholder">Image 6</span>
          </div>
        </div>
        <figcaption>Mountain Peak</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 Image Showcase Gallery</p>
  </footer>
</body>
</html>
