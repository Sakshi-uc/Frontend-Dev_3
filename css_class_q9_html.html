<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combined Effects Demonstration</title>
  <link rel="stylesheet" href="combined-effects.css">
</head>
<body>
  <header>
    <h1>Combined Effects Demo</h1>
    <p>Hover over elements to see multiple effects together</p>
  </header>

  <main>
    <section class="effects-section">
      <div class="effect-box box1">
        <h3>Effect 1</h3>
        <p>Grow + Color Change</p>
      </div>

      <div class="effect-box box2">
        <h3>Effect 2</h3>
        <p>Lift + Shadow</p>
      </div>

      <div class="effect-box box3">
        <h3>Effect 3</h3>
        <p>Rotate + Scale</p>
      </div>

      <div class="effect-box box4">
        <h3>Effect 4</h3>
        <p>Slide + Fade</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 Combined Effects Demo</p>
  </footer>
</body>
</html>
