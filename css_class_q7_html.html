<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Interface Components</title>
  <link rel="stylesheet" href="ui-components.css">
</head>
<body>
  <header>
    <h1>UI Components Page</h1>
    <p>Modern interface elements with consistent styling</p>
  </header>

  <main>
    <section class="ui-card">
      <div class="search-container">
        <input type="text" class="search-bar" placeholder="Search anything...">
        <button class="search-btn">🔍</button>
      </div>

      <div class="buttons-group">
        <button class="btn btn-primary">Primary Action</button>
        <button class="btn btn-secondary">Secondary Action</button>
        <button class="btn btn-outline">Outline Action</button>
      </div>

      <div class="dropdown-container">
        <select class="dropdown">
          <option value="">Select an option</option>
          <option value="option1">Option 1</option>
          <option value="option2">Option 2</option>
          <option value="option3">Option 3</option>
          <option value="option4">Option 4</option>
        </select>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 UI Components Demo</p>
  </footer>
</body>
</html>
