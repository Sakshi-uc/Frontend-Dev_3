<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form Validation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      color: #667eea;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .form-group {
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #555;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    input.valid {
      border-color: #4caf50;
      background-color: #f1f8f4;
    }
    input.invalid {
      border-color: #f44336;
      background-color: #fff5f5;
    }
    .error-message {
      color: #f44336;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }
    .success-message {
      color: #4caf50;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    .message-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .message-box.success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 2px solid #4caf50;
    }
    .message-box.error {
      background-color: #ffebee;
      color: #c62828;
      border: 2px solid #f44336;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>🔐 Login</h2>
    
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="At least 5 characters">
      <div class="error-message" id="usernameError">Username must be at least 5 characters</div>
      <div class="success-message" id="usernameSuccess">✓ Valid username</div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min 8 chars, uppercase, number, special char">
      <div class="error-message" id="passwordError">Password must be at least 8 characters with 1 uppercase, 1 number, and 1 special character</div>
      <div class="success-message" id="passwordSuccess">✓ Strong password</div>
    </div>

    <button onclick="validateLogin()">Login</button>

    <div class="message-box" id="messageBox"></div>
  </div>

  <script>
    const usernameRegex = /^.{5,}$/;
    const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;

    function validateField(inputId, regex, errorId, successId) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(errorId);
      const success = document.getElementById(successId);
      const value = input.value;

      if (regex.test(value)) {
        input.classList.remove('invalid');
        input.classList.add('valid');
        error.style.display = 'none';
        success.style.display = 'block';
        return true;
      } else {
        input.classList.remove('valid');
        input.classList.add('invalid');
        error.style.display = 'block';
        success.style.display = 'none';
        return false;
      }
    }

    document.getElementById('username').addEventListener('input', function() {
      validateField('username', usernameRegex, 'usernameError', 'usernameSuccess');
    });

    document.getElementById('password').addEventListener('input', function() {
      validateField('password', passwordRegex, 'passwordError', 'passwordSuccess');
    });

    function validateLogin() {
      const usernameValid = validateField('username', usernameRegex, 'usernameError', 'usernameSuccess');
      const passwordValid = validateField('password', passwordRegex, 'passwordError', 'passwordSuccess');

      const messageBox = document.getElementById('messageBox');
      messageBox.style.display = 'block';

      if (usernameValid && passwordValid) {
        messageBox.className = 'message-box success';
        messageBox.textContent = '✅ Login Successful! Welcome back!';
        console.log('Login successful');
      } else {
        messageBox.className = 'message-box error';
        
        let errors = [];
        if (!usernameValid) errors.push('username');
        if (!passwordValid) errors.push('password');
        
        messageBox.textContent = `❌ Please fix errors in: ${errors.join(', ')}`;
        console.log('Login failed - Invalid credentials');
      }
    }
  </script>
</body>
</html>
