<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Object Updater</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h2 {
      text-align: center;
      color: #667eea;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .display-section {
      margin-top: 30px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 10px;
      border-left: 4px solid #667eea;
    }
    .display-section h3 {
      color: #667eea;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .user-info {
      background: white;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    .user-info p {
      margin: 8px 0;
      color: #333;
    }
    .user-info strong {
      color: #667eea;
      display: inline-block;
      width: 80px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Dynamic Object Updater</h2>
    
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" value="John">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" value="john@mail.com">
    </div>

    <div class="form-group">
      <label for="age">Age</label>
      <input type="number" id="age" value="21">
    </div>

    <button onclick="updateUser()">Update User Object</button>

    <div class="display-section">
      <h3>Current User Object:</h3>
      <div class="user-info" id="userDisplay"></div>
    </div>
  </div>

  <script>
    let user = {
      name: "John",
      email: "john@mail.com",
      age: 21
    };

    function displayUser() {
      const displayDiv = document.getElementById('userDisplay');
      displayDiv.innerHTML = `
        <p><strong>Name:</strong> ${user.name}</p>
        <p><strong>Email:</strong> ${user.email}</p>
        <p><strong>Age:</strong> ${user.age}</p>
      `;
      console.log("Current User Object:", user);
    }

    function updateUser() {
      const nameInput = document.getElementById('name').value;
      const emailInput = document.getElementById('email').value;
      const ageInput = document.getElementById('age').value;

      user.name = nameInput;
      user.email = emailInput;
      user.age = parseInt(ageInput);

      displayUser();
    }

    displayUser();
  </script>
</body>
</html>
