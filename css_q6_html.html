<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="transformations.css">
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
    <p>Hover over each box to see the transformation effect</p>
  </header>

  <main>
    <section class="transforms-container">
      <div class="transform-box rotate-box">
        <h3>Rotate</h3>
        <p>rotate(45deg)</p>
      </div>

      <div class="transform-box scale-box">
        <h3>Scale</h3>
        <p>scale(1.3)</p>
      </div>

      <div class="transform-box translate-box">
        <h3>Translate</h3>
        <p>translate(20px, -20px)</p>
      </div>

      <div class="transform-box skew-box">
        <h3>Skew</h3>
        <p>skew(10deg, 5deg)</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 CSS Transformations Demo</p>
  </footer>
</body>
</html>
